<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in Glimpse</title>
    <link rel="icon" type="image/png" href="../GlimpseLogo.png">
    <link rel="apple-touch-icon" href="../GlimpseLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #000000 0%, hsl(145, 40%, 4%) 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Animated background gradient */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(60, 229, 100, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            animation: pulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        .bg-glow-1 {
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .bg-glow-2 {
            bottom: -200px;
            right: -200px;
            animation-delay: 2s;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
        }

        .container {
            text-align: center;
            max-width: 500px;
            z-index: 1;
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .eyebrow {
            font-size: 0.75rem;
            font-weight: 600;
            color: #3CE564;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 500;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #3CE564;
            color: #000000;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(60, 229, 100, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(60, 229, 100, 0.4);
            background: #2dd455;
        }

        .cta-button svg {
            width: 24px;
            height: 24px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .secondary-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .secondary-link:hover {
            color: #3CE564;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(60, 229, 100, 0.1);
            border: 1px solid rgba(60, 229, 100, 0.3);
            color: #3CE564;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: #3CE564;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(60, 229, 100, 0.7);
            }

            50% {
                opacity: 0.8;
                box-shadow: 0 0 0 8px rgba(60, 229, 100, 0);
            }
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <div class="logo-container">
            <img src="../GlimpseLogo.png" alt="Glimpse" class="logo">
        </div>

        <div class="eyebrow">Coming Soon</div>
        <h1>This Story is Best in the App</h1>
        <p class="subtitle">Get the full context, ask questions, and dive deeper with Glimpse — the AI-powered news
            experience.</p>

        <div class="status-badge">
            <span class="pulse"></span>
            Launching Soon on the App Store
        </div>

        <a href="../" class="secondary-link">Learn more about Glimpse →</a>
    </div>

    <div class="footer">© 2026 GLIMPSE</div>
</body>

</html>
